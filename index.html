<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typescript</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <form class="container" autocomplete="off">
      <label for="name">Task:</label>
      <input type="text" class="name" />
      <ul class="categories">
        <li>
          <input
            type="radio"
            name="categories"
            value="general"
            id="category-general"
          />
          <label for="category-general">general</label>
        </li>
        <li>
          <input
            type="radio"
            name="categories"
            value="work"
            id="category-work"
          />
          <label for="category-work">work</label>
        </li>
        <li>
          <input type="radio" name="categories" value="gym" id="category-gym" />
          <label for="category-gym">gym</label>
        </li>
      </ul>
      <button id="add">Add</button>
      <p>Todo:</p>
      <ul class="tasks"></ul>
    </form>
    <script src="dist/app.js"></script>
  </body>
</html>
